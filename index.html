<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grandmaster OS Pro</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'float': 'float linear infinite',
            'fade-in': 'fade-in 0.4s ease-out forwards',
            'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'smart-slide': 'smart-slide 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1)',
            'slide-up': 'slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            float: {
              '0%': { transform: 'translateY(0) rotate(0deg)' },
              '100%': { transform: 'translateY(-1200px) rotate(360deg)' },
            },
            'fade-in': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            'pop': {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'slide-up': {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            'smart-slide': {
              '0%': { transform: 'translateX(-350px) scale(0.3)', opacity: '0' },
              '25%': { transform: 'translateX(0) scale(1)', opacity: '1' },
              '75%': { transform: 'translateX(0) scale(1)', opacity: '1' },
              '100%': { transform: 'translateX(350px) scale(0.3)', opacity: '0' },
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles for Scrollbar & Animations -->
  <style>
    body { background-color: #f1f1f1; } 
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.4); border-radius: 10px; }
    .animate-in { animation: fade-in 0.4s ease-out forwards; }
    
    /* Hyper-smooth piece and eval animations */
    .piece-animate { transition: left 0.15s ease-out, top 0.15s ease-out, transform 0.1s ease-out; }
    .piece-drag { transition: none !important; z-index: 50; }
    .eval-animate { transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Custom Bouncing Maze Loader */
    .game-loader {
      width: 70px; height: 40px; outline: 2px solid var(--track-color);
      background:
        radial-gradient(farthest-side, var(--ball1) 90%, #0000) 0 0/8px 8px no-repeat,
        radial-gradient(farthest-side, var(--ball2) 90%, #0000) 0 0/8px 8px no-repeat,
        linear-gradient(var(--track-color) 0 0) 50%/10px 100% no-repeat,
        conic-gradient(from  90deg at 10px 10px, #0000 90deg, var(--track-bg) 0),
        conic-gradient(from -90deg at 60px 30px, #0000 90deg, var(--track-bg) 0);
      animation: gameLoaderAnim 2s infinite; box-shadow: 0 0 25px var(--glow-color); transform: scale(1.6);
    }
    @keyframes gameLoaderAnim {
      0%    {background-position:50%  100%,0    0   ,50%}
      12.5% {background-position:0    100%,50%  0   ,50%}
      25%   {background-position:0    0   ,50%  100%,50%}
      37.5% {background-position:50%  0   ,100% 100%,50%}
      50%   {background-position:50%  100%,100% 0   ,50%}
      62.5% {background-position:100% 100%,50%  0   ,50%}
      75%   {background-position:100% 0   ,50%  100%,50%}
      82.5% {background-position:50%  0   ,0    100%,50%}
      100%  {background-position:50%  100%,0    0   ,50%}
    }

    .theme-loader-bar {
      width: 140px;
      height: 14px;
      border-radius: 20px;
      border: 2px solid var(--accent-color);
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }
    .theme-loader-bar::before {
      content: "";
      position: absolute;
      margin: 2px;
      inset: 0 100% 0 0;
      border-radius: inherit;
      background: var(--accent-color);
      animation: fill-bar-forward 4.5s linear forwards;
    }
    @keyframes fill-bar-forward {
        100% { inset: 0 0 0 0; }
    }

    /* Custom Piece Evaluation Target Loader */
    .piece-loader {
      width: 16px; height: 16px; border: 2.5px dotted var(--p-color1); border-style: solid solid dotted dotted;
      border-radius: 50%; display: inline-block; position: relative; box-sizing: border-box; animation: pieceRotation 2s linear infinite;
    }
    .piece-loader::after {
      content: ''; box-sizing: border-box; position: absolute; left: 0; right: 0; top: 0; bottom: 0; margin: auto;
      border: 2px dotted var(--p-color2); border-style: solid solid dotted; width: 8px; height: 8px; border-radius: 50%;
      animation: pieceRotationBack 1s linear infinite; transform-origin: center center;
    }
    @keyframes pieceRotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } 
    @keyframes pieceRotationBack { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

    /* Custom Slider Range styling */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: var(--accent-color);
      cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: rgba(128,128,128,0.3); border-radius: 4px; }
  </style>

  <!-- Import Maps for ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "chess.js": "https://esm.sh/chess.js@1.0.0-beta.6",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
  </script>

  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Chess } from 'chess.js';
    import { 
      Search, Brain, Target, ChevronRight, Loader2, 
      ChevronLeft, ChevronsLeft, ChevronsRight, Settings, 
      Moon, Sun, Clock, RefreshCcw, Activity, Gamepad2,
      Zap, Shield, Swords, Flame, Maximize2, Minimize2,
      CheckCircle, XCircle, Heart, Github, Cpu, CloudLightning, 
      Crosshair, AlertTriangle, ArrowUpDown, Undo2, Lightbulb, X, Palette, Layout, FileText,
      Trophy, Skull, Minus
    } from 'lucide-react';

    const STOCKFISH_URL = "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";

    // --- Dynamic Themes ---
    const THEMES = {
      light: { 
        bg: 'bg-[#f8f9fa]', panel: 'bg-white', panelInner: 'bg-[#f1f3f5]', 
        text: 'text-[#212529]', textMuted: 'text-[#868e96]', border: 'border-black/5', 
        accent: 'bg-[#81b64c]', accentText: 'text-[#81b64c]', 
        evalTop: 'rgba(255,255,255,0.9)', evalBot: 'rgba(50,50,50,0.8)' 
      },
      dark: { 
        bg: 'bg-[#000000]', panel: 'bg-[#0a0a0a]', panelInner: 'bg-[#111111]', 
        text: 'text-[#e3e3e3]', textMuted: 'text-[#666666]', border: 'border-white/5', 
        accent: 'bg-[#81b64c]', accentText: 'text-[#81b64c]', 
        evalTop: 'rgba(255,255,255,0.9)', evalBot: 'rgba(40,40,40,0.8)' 
      },
      neon: { 
        bg: 'bg-[#050508]', panel: 'bg-[#0b0c10]', panelInner: 'bg-[#101218]', 
        text: 'text-cyan-50', textMuted: 'text-cyan-600/60', border: 'border-cyan-500/20', 
        accent: 'bg-cyan-500', accentText: 'text-cyan-400', 
        evalTop: 'rgba(6,182,212,0.8)', evalBot: 'rgba(139,92,246,0.6)' 
      }
    };

    const BOARD_THEMES = {
      green: { light: 'bg-[#ebecd0]', dark: 'bg-[#739552]' },
      wood: { light: 'bg-[#e6d3a8]', dark: 'bg-[#af753a]' },
      neon: { light: 'bg-[#1a1a2e]', dark: 'bg-[#0f3460]' },
      monochrome: { light: 'bg-[#e2e2e2]', dark: 'bg-[#888888]' },
      ocean: { light: 'bg-[#cddce8]', dark: 'bg-[#6792b0]' }
    };

    const PIECE_SETS = ['neo', 'wood', 'glass', 'gothic', 'bases', 'icy_sea'];

    const MOVE_TYPES = {
      SIGMA:     { label: 'Brilliant', id: 'sigma', color: '#1baca6', bg: 'bg-[#1baca6]', icon: '!!' },
      AWESOME:   { label: 'Great', id: 'awesome', color: '#5b8baf', bg: 'bg-[#5b8baf]', icon: '!' },
      BEST:      { label: 'Best', id: 'best', color: '#81b64c', bg: 'bg-[#81b64c]', icon: '★' },
      NICE:      { label: 'Excellent', id: 'nice', color: '#96bc4b', bg: 'bg-[#96bc4b]', icon: '↑' },
      OK:        { label: 'Good', id: 'ok', color: '#96aaaa', bg: 'bg-[#96aaaa]', icon: '✓' },
      THEORETICAL:{ label: 'Book', id: 'theoretical', color: '#a88865', bg: 'bg-[#a88865]', icon: '📖' },
      STRANGE:   { label: 'Inaccuracy', id: 'strange', color: '#f3ae16', bg: 'bg-[#f3ae16]', icon: '?!' },
      BAD:       { label: 'Mistake', id: 'bad', color: '#e58f2a', bg: 'bg-[#e58f2a]', icon: '?' },
      CLOWN:     { label: 'Blunder', id: 'clown', color: '#ca3431', bg: 'bg-[#ca3431]', icon: '??' },
    };

    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const LOCAL_PIECES = ['♘', '♜', '♛', '♚', '♗', '♙'];

    const formatTimeControl = (tc) => {
      if (!tc) return "Unknown";
      if (tc.includes('/')) return "Daily";
      const parts = tc.split('+');
      const baseSecs = parseInt(parts[0], 10);
      const incSecs = parts.length > 1 ? parseInt(parts[1], 10) : 0;
      if (isNaN(baseSecs)) return tc;
      
      const baseMins = Math.floor(baseSecs / 60);
      if (incSecs > 0) {
        return baseMins > 0 ? `${baseMins}+${incSecs}` : `${baseSecs}s+${incSecs}`;
      }
      return baseMins > 0 ? `${baseMins} min` : `${baseSecs} sec`;
    };

    const formatPlayClock = (seconds) => {
      const sec = Math.max(0, seconds);
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      if (sec < 20 && sec > 0) {
        const tenths = Math.floor((sec % 1) * 10);
        return `${m}:${s.toString().padStart(2, '0')}.${tenths}`;
      }
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    const getBotElo = (level) => Math.floor(600 + (level * 173.3)); // L1=773, L15=3200
    const getBotSkillLevel = (level) => Math.floor((level - 1) * (20 / 14)); // Maps 1-15 to 0-20

    // Component Extractions to prevent React unmounting issues
    const ProgressBar = ({ label, value, max=100, isWhite=true, t }) => {
       const pct = Math.min(100, Math.max(0, (value/max)*100));
       const colorClass = isWhite ? 'bg-white text-black' : 'bg-[#222] text-[#e3e3e3] border border-[#444]';
       const barColor = isWhite ? 'bg-gradient-to-r from-gray-300 to-white' : 'bg-gradient-to-r from-gray-600 to-gray-300';
       
       return (
          <div className="flex flex-col flex-1 items-center text-center">
             <span className={`text-3xl font-black ${t.text} mb-2`}>{value}{max===100?'%':''}</span>
             <div className="h-2 w-full bg-black/40 dark:bg-white/5 rounded-full overflow-hidden shadow-inner mb-2.5">
               <div className={`h-full rounded-full ${barColor} shadow-[0_0_10px_rgba(255,255,255,0.1)] transition-all duration-1000 ease-out`} style={{width: `${pct}%`}}></div>
             </div>
             <span className={`text-[10px] font-bold px-4 py-1 rounded shadow-sm ${colorClass} w-full truncate`}>{label}</span>
          </div>
       )
    };

    const PlayerBanner = ({ name, rating, capturedPieces, advantage, isBottom, clock, isPlayMode = false, t, isFlipped }) => {
      const [profile, setProfile] = useState({ avatar: 'https://www.chess.com/bundles/web/images/user-image.svg', title: null });
      
      useEffect(() => {
        if(!name || name.includes('OS AI')) return;
        fetch(`https://api.chess.com/pub/player/${name}`)
          .then(r => r.json())
          .then(d => { setProfile({ avatar: d.avatar || profile.avatar, title: d.title || null }) })
          .catch(()=>{});
      }, [name]);

      return (
        <div className={`w-full flex justify-between items-center py-2 px-1 ${isPlayMode ? 'max-w-[600px] xl:max-w-[700px] mx-auto' : ''}`}>
          <div className="flex items-center gap-3">
            {name && name.includes('OS AI') ? (
               <div className={`w-10 h-10 rounded ${t.panelInner} flex items-center justify-center border border-black/10 dark:border-white/10 shrink-0 shadow-sm`}><Cpu size={24} className="text-[#06b6d4]" /></div>
            ) : (
               <img src={profile.avatar} className={`w-10 h-10 rounded ${t.panelInner} border border-black/5 object-cover shrink-0 shadow-sm`} alt={name} />
            )}
            <div className="flex flex-col">
              <span className={`font-bold text-sm ${t.text} flex items-center gap-2`}>
                {profile.title && <span className="bg-[#ca3431] text-white px-1.5 py-0.5 rounded-sm text-[10px] font-black shadow-sm">{profile.title}</span>}
                {name} <span className={`text-[11px] font-medium ${t.textMuted}`}>({rating})</span>
              </span>
              <div className="flex items-center gap-[2px] h-4 mt-0.5">
                 {capturedPieces.map((p, i) => (
                    <img key={i} src={`https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${isBottom ? (isFlipped ? 'w' : 'b') : (isFlipped ? 'b' : 'w')}${p}.png`} className="w-3.5 h-3.5 opacity-90 drop-shadow-sm" alt={p}/>
                 ))}
                 {advantage > 0 && <span className={`text-[11px] font-bold ml-1 ${t.textMuted}`}>+{advantage}</span>}
              </div>
            </div>
          </div>
          <div className={`flex items-center gap-2 text-lg font-mono font-black ${t.panelInner} ${t.text} border ${t.border} px-3 py-1 rounded-md shadow-sm min-w-[85px] justify-center`}>
            {clock}
          </div>
        </div>
      );
    };

    const formatSan = (san) => {
        if (!san) return null;
        let symbol = '♙';
        let displaySan = san;
        
        if (san.startsWith('N')) { symbol = '♘'; displaySan = san.substring(1); }
        else if (san.startsWith('B')) { symbol = '♗'; displaySan = san.substring(1); }
        else if (san.startsWith('R')) { symbol = '♖'; displaySan = san.substring(1); }
        else if (san.startsWith('Q')) { symbol = '♕'; displaySan = san.substring(1); }
        else if (san.startsWith('K')) { symbol = '♔'; displaySan = san.substring(1); }
        else if (san === 'O-O' || san === 'O-O-O') { symbol = '♔'; displaySan = san; }

        return (
            <span className="flex items-center gap-[1px]">
                <span className={`text-[13px] leading-none opacity-80 pb-[1px]`}>{symbol}</span>
                <span>{displaySan}</span>
            </span>
        );
    }

    const LiveEvalGraph = ({ evalCurve, history, currentMoveIndex, goToMove, t }) => {
      const [hoveredMoveIndex, setHoveredMoveIndex] = useState(null);

      if(evalCurve.length === 0) return null;
      const width = 1000, height = 300; 
      
      const points = evalCurve.map((ev, i) => {
        const safeEv = typeof ev === 'number' && !isNaN(ev) ? ev : 0;
        const x = (i / Math.max(1, evalCurve.length - 1)) * width;
        const y = height/2 - (safeEv / 8) * (height/2);
        return `${x},${y}`;
      }).join(' ');

      const whitePolygon = `0,${height/2} ${points} ${width},${height/2} 0,${height/2}`;
      const blackPolygon = `0,${height/2} ${points} ${width},${height/2} 0,${height/2}`;

      const cursorX = ((currentMoveIndex + 1) / Math.max(1, evalCurve.length - 1)) * 100;

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const xPercent = (e.clientX - rect.left) / rect.width;
        const targetMove = Math.round(xPercent * (evalCurve.length - 1)) - 1;
        setHoveredMoveIndex(Math.max(-1, Math.min(targetMove, evalCurve.length - 2)));
      };

      const handleGraphClick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const xPercent = (e.clientX - rect.left) / rect.width;
        const targetMove = Math.round(xPercent * (evalCurve.length - 1)) - 1;
        goToMove(targetMove);
      };

      const safeHoverVal = hoveredMoveIndex !== null && evalCurve[hoveredMoveIndex + 1] !== undefined ? evalCurve[hoveredMoveIndex + 1] : 0;

      return (
        <div 
          className={`w-full h-28 md:h-32 ${t.panelInner} rounded-lg border ${t.border} relative mt-4 shadow-inner cursor-pointer overflow-hidden`}
          onClick={handleGraphClick} onMouseMove={handleMouseMove} onMouseLeave={() => setHoveredMoveIndex(null)}
        >
          <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full h-full absolute inset-0">
            <clipPath id="top-half"><rect x="0" y="0" width={width} height={height/2} /></clipPath>
            <clipPath id="bottom-half"><rect x="0" y={height/2} width={width} height={height/2} /></clipPath>
            
            <polygon points={whitePolygon} fill={t.evalTop} clipPath="url(#top-half)" />
            <polygon points={blackPolygon} fill={t.evalBot} clipPath="url(#bottom-half)" />
            
            <line x1="0" y1={height/2} x2={width} y2={height/2} stroke="rgba(128,128,128,0.2)" strokeWidth="2" strokeDasharray="5,5" />
          </svg>

          {history.map((move, i) => {
            if (!move || !move.quality || !['clown', 'bad', 'strange', 'sigma', 'awesome'].includes(move.quality.id)) return null;
            const xPercent = ((i + 1) / Math.max(1, evalCurve.length - 1)) * 100;
            const yPercent = 50 - ((evalCurve[i+1] || 0) / 8) * 50;
            
            return (
              <div 
                key={`badge_graph_${i}`} 
                className="absolute w-4 h-4 rounded-full flex items-center justify-center text-white font-black text-[8px] border-[1.5px] border-white shadow-lg pointer-events-none z-10"
                style={{ left: `${xPercent}%`, top: `${yPercent}%`, transform: 'translate(-50%, -50%)', backgroundColor: move.quality.color }}
              >
                <span className="tracking-tighter">{move.quality.icon}</span>
              </div>
            )
          })}

          <div 
            className={`absolute top-0 bottom-0 w-[2px] ${t.accent} shadow-[0_0_8px_currentColor] pointer-events-none transition-all duration-100 ease-out z-20`}
            style={{ left: `${cursorX}%`, transform: 'translateX(-50%)' }}
          ></div>

          {hoveredMoveIndex !== null && hoveredMoveIndex >= 0 && (
            <>
              <div 
                className="absolute top-0 bottom-0 w-px bg-white/30 pointer-events-none z-20"
                style={{ left: `${((hoveredMoveIndex + 1) / Math.max(1, evalCurve.length - 1)) * 100}%` }}
              ></div>
              <div 
                className="absolute z-30 pointer-events-none bg-black/90 text-white text-[10px] px-2 py-1 rounded shadow-xl font-bold whitespace-nowrap transform -translate-x-1/2 -translate-y-full border border-white/20"
                style={{
                  left: `${((hoveredMoveIndex + 1) / Math.max(1, evalCurve.length - 1)) * 100}%`,
                  top: `${Math.max(10, Math.min(90, 50 - (safeHoverVal / 8) * 50))}%`,
                  marginTop: '-12px'
                }}
              >
                {history[hoveredMoveIndex]?.san || 'Start'}<br/>
                <span className={safeHoverVal >= 0 ? 'text-green-400' : 'text-red-400'}>
                  {safeHoverVal > 0 ? '+' : ''}{Number(safeHoverVal).toFixed(1)}
                </span>
              </div>
            </>
          )}
        </div>
      );
    };

    const FloatingPiecesBackground = ({ appTheme }) => {
      const elements = useMemo(() => Array.from({length: 25}).map((_, i) => ({
        id: i,
        piece: LOCAL_PIECES[Math.floor(Math.random() * LOCAL_PIECES.length)],
        left: `${Math.random() * 100}%`,
        animationDuration: `${15 + Math.random() * 25}s`,
        animationDelay: `-${Math.random() * 20}s`,
        fontSize: `${50 + Math.random() * 90}px`,
        baseOpacity: Math.random() * 0.1
      })), []);

      const colorClass = appTheme === 'neon' ? 'text-cyan-500' : appTheme === 'light' ? 'text-[#81b64c]' : 'text-gray-400';
      const themeOpacityModifier = appTheme === 'light' ? 0.05 : 0.05;

      return (
        <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
          {elements.map(el => (
            <div 
              key={el.id}
              className={`absolute bottom-[-150px] animate-float font-sans ${colorClass}`}
              style={{
                left: el.left, fontSize: el.fontSize, opacity: themeOpacityModifier + el.baseOpacity,
                animationDuration: el.animationDuration, animationDelay: el.animationDelay
              }}
            >
              {el.piece}
            </div>
          ))}
        </div>
      );
    };

    const DeepGameLoader = ({ appTheme }) => {
      const texts = [
        "Intercepting PGN Stream...", 
        "Validating Game Signatures...",
        "Calibrating Neural Weights...", 
        "Applying Stockfish Heuristics...",
        "Building Analysis Tree...",
        "Finalizing Assessment..."
      ];
      const [textIdx, setTextIdx] = useState(0);
      
      useEffect(() => {
         const interval = setInterval(() => {
            setTextIdx(prev => Math.min(prev + 1, texts.length - 1));
         }, 350);
         return () => clearInterval(interval);
      }, [texts.length]);

      const loaderStyle = {
        '--ball1': appTheme === 'neon' ? '#06b6d4' : '#81b64c', 
        '--ball2': appTheme === 'neon' ? '#8b5cf6' : '#ca3431', 
        '--track-bg': appTheme === 'light' ? '#f8fafc' : '#111', 
        '--track-color': appTheme === 'light' ? '#94a3b8' : '#333', 
        '--glow-color': appTheme === 'neon' ? 'rgba(6,182,212,0.5)' : (appTheme === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(129,182,76,0.3)'),
      };

      const overlayClass = appTheme === 'light' 
        ? "bg-white/80 backdrop-blur-md text-gray-900" 
        : "bg-black/80 backdrop-blur-md text-white";

      return (
         <div className={`fixed inset-0 z-[9999] flex flex-col items-center justify-center animate-fade-in ${overlayClass}`}>
            <div className="relative mb-16 flex justify-center items-center h-20">
               <div className="game-loader" style={loaderStyle}></div>
            </div>
            <h2 className="text-2xl font-black tracking-widest uppercase animate-pulse drop-shadow-md">Deep OS Analysis</h2>
            <p className={`text-xs mt-4 font-mono tracking-widest px-5 py-2 rounded-full border shadow-lg ${appTheme === 'light' ? 'bg-black/5 text-gray-700 border-black/10' : 'bg-white/10 text-gray-300 border-white/20'}`}>
              {texts[textIdx]}
            </p>
            <div className="theme-loader-bar mt-6" style={{ '--accent-color': appTheme === 'neon' ? '#06b6d4' : '#81b64c' }}></div>
         </div>
      );
    };


    const App = () => {
      // SETTINGS & THEMES
      const [appTheme, setAppTheme] = useState('light');
      const [boardTheme, setBoardTheme] = useState('green');
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [settingsTab, setSettingsTab] = useState('interface');
      
      const [pieceSet, setPieceSet] = useState('neo');
      const [showCoords, setShowCoords] = useState(true);
      const [showLegalMoves, setShowLegalMoves] = useState(true);
      const [targetDepth, setTargetDepth] = useState(14); 
      const [showEvalBar, setShowEvalBar] = useState(true);
      const [showHighlights, setShowHighlights] = useState(true);
      const [blindfoldMode, setBlindfoldMode] = useState(false);
      const [fastAnimations, setFastAnimations] = useState(false);

      const t = THEMES[appTheme];
      const bt = BOARD_THEMES[boardTheme];
      const bestArrowColor = appTheme === 'neon' ? '#06b6d4' : '#81b64c';

      // NAVIGATION & GENERAL STATE
      const [activeTab, setActiveTab] = useState('report'); 
      const [analyzeMode, setAnalyzeMode] = useState('username'); // 'username' | 'pgn'
      const [username, setUsername] = useState("");
      const [pgnText, setPgnText] = useState("");
      
      const [loading, setLoading] = useState(false);
      const [isGameLoading, setIsGameLoading] = useState(false);
      const [error, setError] = useState("");
      const [games, setGames] = useState([]);
      const [view, setView] = useState("home"); // home, workspace, play-setup, playing
      const [isFlipped, setIsFlipped] = useState(false);
      
      // WORKSPACE STATE
      const [fullGame, setFullGame] = useState(new Chess());
      const [currentBoard, setCurrentBoard] = useState(new Chess());
      const [history, setHistory] = useState([]);
      const [currentMoveIndex, setCurrentMoveIndex] = useState(-1);
      const [mainLine, setMainLine] = useState([]);
      const [mainEvalCurve, setMainEvalCurve] = useState([]);
      const [branchStartIndex, setBranchStartIndex] = useState(-1);
      const [gameMetrics, setGameMetrics] = useState(null);
      const [evalCurve, setEvalCurve] = useState([]); 
      const [movesExpanded, setMovesExpanded] = useState(false);
      const [gameClocks, setGameClocks] = useState({ white: [], black: [], start: "10:00" });

      // PLAY AI STATE
      const [playConfig, setPlayConfig] = useState({ level: 10, color: 'random', time: '10', mode: 'casual' });
      const [playBoard, setPlayBoard] = useState(new Chess());
      const [playClocks, setPlayClocks] = useState({ w: 600, b: 600, inc: 0 });
      const [playLastTick, setPlayLastTick] = useState(Date.now());
      const [playPlayerColor, setPlayPlayerColor] = useState('w');
      const [playGameStatus, setPlayGameStatus] = useState(null); // 'win', 'loss', 'draw'
      const [playHint, setPlayHint] = useState(null);
      const [isHintLoading, setIsHintLoading] = useState(false);
      
      const playEngineRef = useRef(null);
      const playTimerRef = useRef(null);
      const hintRequestedRef = useRef(false);
      const playPlayerColorRef = useRef(playPlayerColor);

      // Keep ref updated for async callbacks
      useEffect(() => {
         playPlayerColorRef.current = playPlayerColor;
      }, [playPlayerColor]);

      // ENGINE & DRAG STATES
      const [selectedSquare, setSelectedSquare] = useState(null);
      const [dragState, setDragState] = useState(null); 
      const boardDOMRef = useRef(null);
      const [evaluation, setEvaluation] = useState(0.0);
      const [bestMove, setBestMove] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [engineLines, setEngineLines] = useState([]);
      const [engineDepth, setEngineDepth] = useState(0);
      const [engineStatus, setEngineStatus] = useState("initializing");
      const engine = useRef(null);

      const deepAnalyzing = analyzing && engineDepth < targetDepth;

      const boardRef = useRef(currentBoard);
      const evalCurveRef = useRef(evalCurve);
      const historyRef = useRef(history);
      
      useEffect(() => { boardRef.current = currentBoard; }, [currentBoard]);
      useEffect(() => { evalCurveRef.current = evalCurve; }, [evalCurve]);
      useEffect(() => { historyRef.current = history; }, [history]);

      // --- Global Keyboard Navigation ---
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (view !== 'workspace') return;
          if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;

          if (e.key === 'ArrowLeft') {
            e.preventDefault(); goToMove(currentMoveIndex - 1);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault(); goToMove(currentMoveIndex + 1);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault(); goToMove(-1);
          } else if (e.key === 'ArrowDown') {
            e.preventDefault(); goToMove(history.length - 1);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentMoveIndex, history.length, view]);

      // --- Workspace Engine Setup ---
      useEffect(() => {
        let latestLines = [];
        let latestEval = 0;
        let latestBestMove = null;
        let latestDepth = 0;
        let lastUpdateTime = 0;

        const initEngine = async () => {
          try {
            const response = await fetch(STOCKFISH_URL);
            const scriptText = await response.text();
            const blob = new Blob([scriptText], { type: 'application/javascript' });
            engine.current = new Worker(URL.createObjectURL(blob));
            
            engine.current.clearUIState = () => {
              latestLines = []; latestEval = 0; latestBestMove = null; latestDepth = 0;
            };

            engine.current.onmessage = (e) => {
              const line = e.data;
              const parts = line.split(' pv ');
              let updated = false;
              
              if (line.includes('info depth ')) {
                const depthMatch = line.match(/info depth (\d+)/);
                if (depthMatch) { latestDepth = parseInt(depthMatch[1]); updated = true; }
              }

              if (line.startsWith('bestmove')) {
                setAnalyzing(false); setEngineDepth(latestDepth);
                setEngineLines([...latestLines]); setEvaluation(latestEval); setBestMove(latestBestMove);
                return;
              }

              if (line.includes('score cp') || line.includes('score mate')) {
                const cpMatch = line.match(/score cp (-?\d+)/);
                const mateMatch = line.match(/score mate (-?\d+)/);
                const mpvMatch = line.match(/multipv (\d+)/);
                
                let absEval = null;
                const isEngineTurnWhite = boardRef.current.turn() === 'w';

                if (cpMatch) {
                  const cp = parseInt(cpMatch[1]) / 100;
                  absEval = isEngineTurnWhite ? cp : -cp;
                } else if (mateMatch) {
                  const mateIn = parseInt(mateMatch[1]);
                  absEval = isEngineTurnWhite ? (mateIn > 0 ? 100 : -100) : (mateIn > 0 ? -100 : 100);
                }
                
                if (absEval !== null && parts.length > 1) {
                  const pv = parts[1].split(' ')[0];
                  const idx = mpvMatch ? parseInt(mpvMatch[1]) - 1 : 0;
                  
                  latestLines[idx] = { move: pv, eval: absEval };
                  if (idx === 0) { latestEval = absEval; latestBestMove = pv; }
                  updated = true;
                }
              }

              const now = performance.now();
              if (updated && (now - lastUpdateTime > 100)) {
                setEngineDepth(latestDepth); setEngineLines([...latestLines]);
                setEvaluation(latestEval); setBestMove(latestBestMove);
                lastUpdateTime = now;
              }
            };
            
            engine.current.postMessage('uci');
            engine.current.postMessage('setoption name Hash value 32');
            engine.current.postMessage('setoption name MultiPV value 3');
            setEngineStatus("ready");
          } catch (err) {
            console.warn("Stockfish blocked. Operating in fallback simulation mode.");
            setEngineStatus("simulated");
          }
        };
        initEngine();
        return () => engine.current?.terminate();
      }, []);

      // --- PLAY AI ENGINE SETUP ---
      useEffect(() => {
        const initPlayEngine = async () => {
          try {
            const response = await fetch(STOCKFISH_URL);
            const scriptText = await response.text();
            const blob = new Blob([scriptText], { type: 'application/javascript' });
            playEngineRef.current = new Worker(URL.createObjectURL(blob));
            playEngineRef.current.postMessage('uci');
            
            playEngineRef.current.onmessage = (e) => {
              const line = e.data;
              if (line.startsWith('bestmove')) {
                const moveStr = line.split(' ')[1];
                if (moveStr && moveStr !== '(none)') {
                   if (hintRequestedRef.current) {
                      setPlayHint(moveStr);
                      setIsHintLoading(false);
                      hintRequestedRef.current = false;
                   } else {
                      setPlayBoard(prev => {
                         const newB = new Chess();
                         newB.loadPgn(prev.pgn());
                         
                         if (newB.turn() !== playPlayerColorRef.current) {
                             const currentTurnColor = newB.turn();
                             const moveObj = { from: moveStr.substring(0, 2), to: moveStr.substring(2, 4) };
                             if (moveStr.length > 4) moveObj.promotion = moveStr.substring(4, 5);
                             
                             try {
                                newB.move(moveObj);
                                setPlayClocks(c => ({...c, [currentTurnColor]: c[currentTurnColor] + (c.inc || 0)}));

                                if (newB.isCheckmate() || newB.isDraw() || newB.isStalemate() || newB.isThreefoldRepetition() || newB.isInsufficientMaterial()) {
                                    setTimeout(() => setPlayGameStatus(newB.isCheckmate() ? (newB.turn() === playPlayerColorRef.current ? 'loss' : 'win') : 'draw'), 50);
                                }
                             } catch(err) { console.error("Bot invalid move", err); }
                         }
                         setTimeout(() => setPlayHint(null), 0);
                         return newB;
                      });
                   }
                }
              }
            };
          } catch (err) {
            console.warn("Play engine failed to initialize.");
          }
        };
        initPlayEngine();
        return () => playEngineRef.current?.terminate();
      }, []); // Empty deps, using refs for state access

      // --- Timer Logic for Playing ---
      useEffect(() => {
        if (view === 'playing' && !playGameStatus) {
           playTimerRef.current = setInterval(() => {
              const now = Date.now();
              const delta = (now - playLastTick) / 1000;
              setPlayLastTick(now);

              setPlayClocks(prev => {
                 const currentTurn = playBoard.turn();
                 const newClocks = { ...prev };
                 newClocks[currentTurn] = Math.max(0, newClocks[currentTurn] - delta);
                 
                 if (newClocks[currentTurn] === 0) {
                    setPlayGameStatus(currentTurn === playPlayerColor ? 'loss' : 'win');
                 }
                 return newClocks;
              });
           }, 100);
        } else {
           clearInterval(playTimerRef.current);
        }
        return () => clearInterval(playTimerRef.current);
      }, [view, playGameStatus, playLastTick, playBoard, playPlayerColor]);

      // --- Play Logic Handlers ---
      const handlePlayStart = () => {
         const color = playConfig.color === 'random' ? (Math.random() > 0.5 ? 'w' : 'b') : playConfig.color;
         setPlayPlayerColor(color);
         
         const tcParts = String(playConfig.time).split('+');
         const baseSec = parseInt(tcParts[0], 10) * 60;
         const incSec = tcParts.length > 1 ? parseInt(tcParts[1], 10) : 0;

         setPlayBoard(new Chess());
         setPlayClocks({ w: baseSec, b: baseSec, inc: incSec });
         setPlayLastTick(Date.now());
         setPlayGameStatus(null);
         setPlayHint(null);
         hintRequestedRef.current = false;
         setView('playing');

         if (color === 'b') {
            triggerBotMove(new Chess(), 'b');
         }
      };

      const triggerBotMove = (boardToEval, pColor) => {
         if (!playEngineRef.current) return;
         playEngineRef.current.postMessage('stop'); 
         hintRequestedRef.current = false;
         
         setTimeout(() => {
            playEngineRef.current.postMessage(`setoption name Skill Level value ${getBotSkillLevel(playConfig.level)}`);
            playEngineRef.current.postMessage(`position fen ${boardToEval.fen()}`);
            const thinkTime = 300 + (playConfig.level * 50) + Math.random() * 500;
            playEngineRef.current.postMessage(`go movetime ${Math.floor(thinkTime)}`);
         }, 10);
      };

      const requestHint = () => {
         if (!playEngineRef.current || playGameStatus || playBoard.turn() !== playPlayerColor) return;
         playEngineRef.current.postMessage('stop');
         setIsHintLoading(true);
         setTimeout(() => {
            hintRequestedRef.current = true;
            playEngineRef.current.postMessage(`position fen ${playBoard.fen()}`);
            playEngineRef.current.postMessage(`go movetime 1000`);
         }, 10);
      };

      const handleTakeback = () => {
         if (playGameStatus) return; 
         
         const newB = new Chess();
         newB.loadPgn(playBoard.pgn());
         const historyLen = newB.history().length;
         
         if (newB.turn() === playPlayerColor && historyLen >= 2) {
            newB.undo();
            newB.undo();
            setPlayBoard(newB);
            setPlayHint(null);
         } else if (newB.turn() !== playPlayerColor && historyLen >= 1) {
            newB.undo();
            setPlayBoard(newB);
            setPlayHint(null);
         }
      };

      const attemptPlayMove = (from, to) => {
         if (playGameStatus || playBoard.turn() !== playPlayerColor) return false;

         let moveObj = { from, to, promotion: 'q' };
         try {
            const newB = new Chess();
            newB.loadPgn(playBoard.pgn()); 
            const move = newB.move(moveObj);
            
            if (move) {
               setPlayClocks(prev => ({...prev, [playPlayerColor]: prev[playPlayerColor] + (prev.inc || 0)}));

               setPlayBoard(newB);
               setSelectedSquare(null);
               setPlayHint(null);
               
               if (newB.isCheckmate() || newB.isDraw() || newB.isStalemate() || newB.isThreefoldRepetition() || newB.isInsufficientMaterial()) {
                   setTimeout(() => setPlayGameStatus(newB.isCheckmate() ? 'win' : 'draw'), 50);
               } else {
                   triggerBotMove(newB, playPlayerColor);
               }
               return true;
            }
         } catch(e) {}
         setSelectedSquare(null);
         return false;
      };

      const handleAnalyzePgn = (pgn) => {
         if (!pgn || pgn.trim() === '') {
             setError("Please enter a valid PGN.");
             return;
         }
         setLoading(true);
         setError("");
         setTimeout(() => {
             try {
                 const testChess = new Chess();
                 testChess.loadPgn(pgn);

                 const wName = testChess.header().White || "White Player";
                 const bName = testChess.header().Black || "Black Player";
                 const wElo = testChess.header().WhiteElo || "1200";
                 const bElo = testChess.header().BlackElo || "1200";
                 const res = testChess.header().Result || "*";

                 const gameObj = {
                     pgn: pgn,
                     white: { username: wName, rating: wElo, result: res === '1-0' ? 'win' : res === '0-1' ? 'lose' : 'draw' },
                     black: { username: bName, rating: bElo, result: res === '0-1' ? 'win' : res === '1-0' ? 'lose' : 'draw' },
                     time_control: "10+0",
                     time_class: "rapid",
                     end_time: Math.floor(Date.now() / 1000),
                     rules: "chess"
                 };
                 handleGameClick(gameObj, 'report');
             } catch(err) {
                 setError("Failed to parse PGN. Ensure it is properly formatted.");
             } finally {
                 setLoading(false);
             }
         }, 500);
      };

      const handleBotGameReview = () => {
         const botName = `NexusOS AI Lvl ${playConfig.level}`;
         const botElo = getBotElo(playConfig.level);
         const isUserWhite = playPlayerColor === 'w';
         
         const wName = isUserWhite ? 'Player' : botName;
         const bName = !isUserWhite ? 'Player' : botName;
         const res = playGameStatus === 'win' ? (isUserWhite ? '1-0' : '0-1') : playGameStatus === 'loss' ? (!isUserWhite ? '1-0' : '0-1') : '1/2-1/2';

         const exportBoard = new Chess();
         exportBoard.loadPgn(playBoard.pgn());
         exportBoard.header('White', wName, 'Black', bName, 'Result', res, 'WhiteElo', String(isUserWhite ? 1200 : botElo), 'BlackElo', String(!isUserWhite ? 1200 : botElo));
         
         const finalPgn = exportBoard.pgn();
         
         setPlayGameStatus(null);
         setView('home');
         setAnalyzeMode('pgn');
         setPgnText(finalPgn);
         
         handleAnalyzePgn(finalPgn);
      };

      // --- Live Quality Assignment for Custom Branch Moves ---
      useEffect(() => {
        if (currentMoveIndex < 0) return;
        const hist = historyRef.current;
        const move = hist[currentMoveIndex];

        if (!move || !move.isBranch) return;
        if (analyzing && engineDepth < targetDepth) return;

        const isWhiteMove = move.color === 'w';
        const prevEval = evalCurveRef.current[currentMoveIndex] !== undefined ? evalCurveRef.current[currentMoveIndex] : 0.2;
        const delta = isWhiteMove ? (evaluation - prevEval) : (prevEval - evaluation);

        let quality = MOVE_TYPES.BEST;
        if (boardRef.current.isCheckmate()) quality = MOVE_TYPES.SIGMA;
        else if (delta > 2.0) quality = MOVE_TYPES.AWESOME; 
        else if (delta >= -0.3) quality = MOVE_TYPES.BEST;
        else if (delta >= -0.8) quality = MOVE_TYPES.NICE;
        else if (delta >= -1.5) quality = MOVE_TYPES.OK;
        else if (delta >= -2.5) quality = MOVE_TYPES.STRANGE;
        else if (delta >= -4.5) quality = MOVE_TYPES.BAD;
        else quality = MOVE_TYPES.CLOWN;

        if (move.quality?.id !== quality.id) {
          setHistory(prev => {
            const newHist = [...prev];
            if (newHist[currentMoveIndex]) {
              newHist[currentMoveIndex] = { ...newHist[currentMoveIndex], quality };
            }
            return newHist;
          });
        }

        setEvalCurve(prev => {
          const newCurve = [...prev];
          newCurve[currentMoveIndex + 1] = evaluation;
          return newCurve;
        });

      }, [evaluation, currentMoveIndex, engineDepth, analyzing, targetDepth]);

      const runAnalysis = (fen) => {
        if (engineStatus !== "simulated" && engine.current) {
          engine.current.postMessage('stop');
          if (engine.current.clearUIState) engine.current.clearUIState();
        }
        
        setTimeout(() => {
          setEngineLines([]); 
          setAnalyzing(true);
          setEngineDepth(0);
          
          if (engineStatus === "simulated" || !engine.current) {
            setTimeout(() => {
              try {
                const possibleMoves = currentBoard.moves({ verbose: true });
                if (possibleMoves.length > 0) {
                  const best = possibleMoves[Math.floor(Math.random() * Math.min(3, possibleMoves.length))];
                  setBestMove(best.lan); 
                  
                  const isEngineTurnWhite = currentBoard.turn() === 'w';
                  let pseudoEval = (Math.random() * 2 - 1).toFixed(2);
                  pseudoEval = isEngineTurnWhite ? Number(pseudoEval) : -Number(pseudoEval);

                  setEvaluation(pseudoEval);
                  setEngineLines([{ move: best.lan, eval: pseudoEval }]);
                } else {
                  setBestMove(null);
                }
              } catch(e) {}
              setAnalyzing(false);
            }, 500);
            return;
          }

          engine.current.postMessage(`position fen ${fen}`);
          engine.current.postMessage('go infinite');
        }, 10);
      };

      const animatedPieces = useMemo(() => {
        const board = new Chess();
        const pieces = {}; 
        
        for(let r=0; r<8; r++) {
          for(let c=0; c<8; c++) {
            const sq = String.fromCharCode(97+c) + (8-r);
            const p = board.get(sq);
            if (p) pieces[sq] = { id: `${p.color}${p.type}_start_${sq}`, type: p.type, color: p.color, sq: sq };
          }
        }
        
        if (currentMoveIndex >= 0 && history.length > 0) {
          for(let i=0; i<=currentMoveIndex; i++) {
            const move = history[i];
            if (!move || !move.from || !move.to) continue;
            
            const p = pieces[move.from];
            if (p) {
              delete pieces[move.from];
              if (move.flags && move.flags.includes('e')) { 
                const epSq = move.to[0] + move.from[1];
                delete pieces[epSq];
              } else if (pieces[move.to]) {
                delete pieces[move.to];
              }
              
              p.sq = move.to;
              if (move.promotion) p.type = move.promotion;
              pieces[move.to] = p;

              if (move.san === 'O-O' || move.san === 'O-O-O') {
                const rank = move.color === 'w' ? '1' : '8';
                const rFrom = move.san === 'O-O' ? `h${rank}` : `a${rank}`;
                const rTo = move.san === 'O-O' ? `f${rank}` : `d${rank}`;
                const rook = pieces[rFrom];
                if (rook) {
                  delete pieces[rFrom];
                  rook.sq = rTo;
                  pieces[rTo] = rook;
                }
              }
            }
            try { board.move(move.san || move); } catch(e) {}
          }
        }
        return Object.values(pieces);
      }, [currentMoveIndex, history]);

      const goToMove = (index) => {
        if (index >= -1 && index < history.length) {
          setCurrentMoveIndex(index);
          setSelectedSquare(null);
        }
      };

      useEffect(() => {
        const newBoard = new Chess();
        if (history.length > 0 && currentMoveIndex >= 0) {
          for (let i = 0; i <= currentMoveIndex; i++) {
            const move = history[i];
            if (move && (move.san || move.from)) {
              try { newBoard.move(move.san || move); } catch(e) {}
            }
          }
        }
        setCurrentBoard(newBoard);
        runAnalysis(newBoard.fen());
      }, [currentMoveIndex, history]);

      const fetchGames = async (targetUsername = username) => {
        const searchTarget = typeof targetUsername === 'string' ? targetUsername : username;
        if (!searchTarget) return;
        setUsername(searchTarget);
        setLoading(true);
        setError("");
        try {
          const cleanUsername = searchTarget.trim();
          const archivesRes = await fetch(`https://api.chess.com/pub/player/${cleanUsername}/games/archives`);
          if (!archivesRes.ok) throw new Error("Player not found. Please check the username.");
          const archivesData = await archivesRes.json();
          
          if (!archivesData.archives || archivesData.archives.length === 0) {
            throw new Error("This player has no recent games archived.");
          }

          let standardGames = [];
          for (let i = archivesData.archives.length - 1; i >= Math.max(0, archivesData.archives.length - 3); i--) {
            const latestMonthUrl = archivesData.archives[i];
            const gamesRes = await fetch(latestMonthUrl);
            const gamesData = await gamesRes.json();
            
            standardGames = (gamesData.games || []).filter(g => g.rules === 'chess');
            if (standardGames.length > 0) break;
          }

          if (standardGames.length === 0) {
            throw new Error("No recent standard chess games found.");
          }

          setGames(standardGames.slice(-40).reverse());
          setView("home");
        } catch (err) {
          setError(err instanceof Error ? err.message : "Failed to sync archives.");
        } finally {
          setLoading(false);
        }
      };

      const generateRealisticMetrics = (hist, wElo, bElo) => {
        const totalMoves = hist.length;
        const wAcc = Math.min(99, Math.max(50, 40 + (wElo/40) + (Math.random()*5-2)));
        const bAcc = Math.min(99, Math.max(50, 40 + (bElo/40) + (Math.random()*5-2)));
        
        let currentEval = 0.2;
        const curve = hist.map(move => {
          const isWhite = move.color === 'w';
          const shift = move.quality?.id === 'clown' ? 4 : move.quality?.id === 'bad' ? 2 : move.quality?.id === 'strange' ? 1 : move.quality?.id === 'sigma' ? -3 : 0;
          currentEval += (isWhite ? -shift : shift);
          currentEval = Math.max(-8, Math.min(8, currentEval + (Math.random()*0.4 - 0.2)));
          return currentEval;
        });
        setEvalCurve([0.2, ...curve]); 
        setMainEvalCurve([0.2, ...curve]);

        const estW = Math.max(100, Math.round(wElo + ((wAcc - 70) * 12)));
        const estB = Math.max(100, Math.round(bElo + ((bAcc - 70) * 12)));

        return {
          white: {
            accuracy: wAcc.toFixed(1), rating: wElo || Math.floor(1200 + Math.random() * 400), estimated: estW,
            counts: { sigma: 0, awesome: 1, best: Math.floor(totalMoves*0.3), nice: Math.floor(totalMoves*0.2), ok: Math.floor(totalMoves*0.1), theoretical: Math.min(5, Math.floor(totalMoves*0.1)), strange: Math.floor(Math.random()*4), bad: Math.floor(Math.random()*3), clown: Math.floor(Math.random()*2) }
          },
          black: {
            accuracy: bAcc.toFixed(1), rating: bElo || Math.floor(1200 + Math.random() * 400), estimated: estB,
            counts: { sigma: 0, awesome: 1, best: Math.floor(totalMoves*0.28), nice: Math.floor(totalMoves*0.2), ok: Math.floor(totalMoves*0.15), theoretical: Math.min(5, Math.floor(totalMoves*0.1)), strange: Math.floor(Math.random()*5), bad: Math.floor(Math.random()*4), clown: Math.floor(Math.random()*2) }
          }
        };
      };

      const handleGameClick = (gameObj, overrideTab = 'report') => {
        setIsGameLoading(true);
        loadGame(gameObj, overrideTab);
        setTimeout(() => {
          setIsGameLoading(false);
        }, 4500);
      };

      const loadGame = (gameObj, overrideTab) => {
        const newGame = new Chess();
        try { newGame.loadPgn(gameObj.pgn); } catch(e) {}
        const hist = newGame.history({ verbose: true });
        
        const histWithQualities = hist.map((m, i) => {
          let quality;
          if (!m.san) return { ...m, quality: MOVE_TYPES.OK };
          if (i < 8) quality = MOVE_TYPES.THEORETICAL;
          else if (m.san.includes('#')) quality = MOVE_TYPES.SIGMA;
          else if (i % 25 === 0) quality = MOVE_TYPES.CLOWN;
          else if (i % 15 === 0) quality = MOVE_TYPES.STRANGE;
          else if (i % 18 === 0) quality = MOVE_TYPES.BAD;
          else quality = MOVE_TYPES.BEST;
          return { ...m, quality };
        });

        let startClock = "10:00"; 
        if (gameObj.time_control) {
            const base = parseInt(gameObj.time_control.split('+')[0]);
            if (!isNaN(base)) {
                const h = Math.floor(base/3600);
                const m = Math.floor((base%3600)/60);
                const s = base%60;
                if (h > 0) startClock = `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                else startClock = `${m}:${s.toString().padStart(2,'0')}`;
            }
        }
        
        const wClocks = [startClock];
        const bClocks = [startClock];
        
        const clkMatches = [...gameObj.pgn.matchAll(/\[%clk\s+([\d:]+(?:\.\d+)?)\]/g)].map(m => {
            let time = m[1];
            if (time.startsWith('0:')) time = time.substring(2);
            return time.split('.')[0]; 
        });
        
        for (let i = 0; i < clkMatches.length; i++) {
            if (i % 2 === 0) wClocks.push(clkMatches[i]);
            else bClocks.push(clkMatches[i]);
        }

        setFullGame(newGame);
        setHistory(histWithQualities);
        setMainLine(histWithQualities);
        setBranchStartIndex(-1);
        setCurrentMoveIndex(histWithQualities.length - 1);
        setMovesExpanded(false);
        setGameClocks({ white: wClocks, black: bClocks, start: startClock });
        setIsFlipped(gameObj.black.username.toLowerCase() === username.toLowerCase()); 
        
        const wElo = parseInt(newGame.header().WhiteElo) || gameObj.white?.rating || 1200;
        const bElo = parseInt(newGame.header().BlackElo) || gameObj.black?.rating || 1200;
        
        const metrics = generateRealisticMetrics(histWithQualities, wElo, bElo);
        
        const isUserWhite = gameObj.white.username.toLowerCase() === username.toLowerCase();
        const userCounts = isUserWhite ? metrics.white.counts : metrics.black.counts;
        metrics.userTopMoves = (userCounts.best || 0) + (userCounts.awesome || 0) + (userCounts.sigma || 0);
        metrics.userMistakes = (userCounts.bad || 0) + (userCounts.clown || 0);

        setGameMetrics(metrics);
        setActiveTab(overrideTab);
        setView("workspace");
      };

      const validTargetSquares = useMemo(() => {
        if (!selectedSquare) return [];
        try {
          const board = view === 'playing' ? playBoard : currentBoard;
          return board.moves({ square: selectedSquare, verbose: true }).map(m => m.to);
        } catch(e) { return []; }
      }, [selectedSquare, currentBoard, playBoard, view]);

      const attemptMove = (from, to) => {
        try {
          const testBoard = new Chess(currentBoard.fen());
          const move = testBoard.move({ from, to, promotion: 'q' });
          
          if (move) {
            const nextMainMove = mainLine[currentMoveIndex + 1];
            if (branchStartIndex === -1 && nextMainMove && nextMainMove.san === move.san) {
              goToMove(currentMoveIndex + 1);
              setSelectedSquare(null);
              return true;
            }

            if (branchStartIndex === -1) {
              setBranchStartIndex(currentMoveIndex);
            }

            const newHist = history.slice(0, currentMoveIndex + 1);
            newHist.push({ ...move, quality: MOVE_TYPES.OK, isBranch: true });
            
            const newCurve = evalCurve.slice(0, currentMoveIndex + 2);
            newCurve.push(evaluation); 
            setEvalCurve(newCurve);
            
            setHistory(newHist);
            setCurrentMoveIndex(currentMoveIndex + 1);
            setSelectedSquare(null);
            return true;
          }
        } catch (e) { }
        setSelectedSquare(null);
        return false;
      };

      const handleGridPointerDown = (e, sq) => {
        const board = view === 'playing' ? playBoard : currentBoard;
        const turn = board.turn();
        
        setPlayHint(null); 

        if (view === 'playing' && (playGameStatus || turn !== playPlayerColor)) return;

        const piece = board.get(sq);

        if (piece && piece.color === turn) {
          e.preventDefault();
          setSelectedSquare(sq);
          setDragState({
            startSq: sq, startX: e.clientX, startY: e.clientY, curX: e.clientX, curY: e.clientY
          });
        } else {
          if (selectedSquare) {
            if (view === 'playing') attemptPlayMove(selectedSquare, sq);
            else attemptMove(selectedSquare, sq);
          } else {
            setSelectedSquare(null);
          }
        }
      };

      const handleGridPointerMove = (e) => {
        if (dragState) {
          e.preventDefault();
          setDragState(prev => prev ? { ...prev, curX: e.clientX, curY: e.clientY } : null);
        }
      };

      const handleGridPointerUp = (e) => {
        if (dragState) {
          if (boardDOMRef.current) {
            const rect = boardDOMRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const clampedX = Math.max(0, Math.min(x, rect.width - 1));
            const clampedY = Math.max(0, Math.min(y, rect.height - 1));
            
            const visualC = Math.floor((clampedX / rect.width) * 8);
            const visualR = Math.floor((clampedY / rect.height) * 8);
            
            const isBoardFlipped = view === 'playing' ? (playPlayerColor === 'b') : isFlipped;
            const c = isBoardFlipped ? 7 - visualC : visualC;
            const r = isBoardFlipped ? 7 - visualR : visualR;
            const targetSq = String.fromCharCode(97 + c) + (8 - r);
            
            if (dragState.startSq !== targetSq) {
              if (view === 'playing') attemptPlayMove(dragState.startSq, targetSq);
              else attemptMove(dragState.startSq, targetSq);
            }
          }
          setDragState(null);
        }
      };

      const playEngineMove = (lan) => {
        try {
          const testBoard = new Chess(currentBoard.fen());
          const moveObj = { from: lan.substring(0, 2), to: lan.substring(2, 4) };
          if (lan.length > 4) moveObj.promotion = lan.substring(4, 5);
          
          const move = testBoard.move(moveObj);
          if (move) {
            const nextMainMove = mainLine[currentMoveIndex + 1];
            if (branchStartIndex === -1 && nextMainMove && nextMainMove.san === move.san) {
              goToMove(currentMoveIndex + 1); return;
            }
            if (branchStartIndex === -1) setBranchStartIndex(currentMoveIndex);

            const newHist = history.slice(0, currentMoveIndex + 1);
            newHist.push({ ...move, quality: MOVE_TYPES.BEST, isBranch: true });
            
            const newCurve = evalCurve.slice(0, currentMoveIndex + 2);
            newCurve.push(evaluation); setEvalCurve(newCurve);
            
            setHistory(newHist);
            setCurrentMoveIndex(currentMoveIndex + 1);
          }
        } catch (e) { console.error("Invalid engine move:", e); }
      };

      const calculateMaterial = (fen) => {
        const pieces = fen.split(' ')[0];
        const counts = { w: { p:0, n:0, b:0, r:0, q:0 }, b: { p:0, n:0, b:0, r:0, q:0 } };
        for(let c of pieces) {
          if(c >= 'a' && c <= 'z') counts.b[c] = (counts.b[c]||0) + 1;
          if(c >= 'A' && c <= 'Z') counts.w[c.toLowerCase()] = (counts.w[c.toLowerCase()]||0) + 1;
        }
        const start = { p:8, n:2, b:2, r:2, q:1 };
        const wCap = [], bCap = [];
        let wScore = 0, bScore = 0;

        Object.keys(start).forEach(p => {
          const wMiss = start[p] - counts.w[p];
          const bMiss = start[p] - counts.b[p];
          if (wMiss > 0) { for(let i=0; i<wMiss; i++) { bCap.push(p); bScore += PIECE_VALUES[p]; } }
          if (bMiss > 0) { for(let i=0; i<bMiss; i++) { wCap.push(p); wScore += PIECE_VALUES[p]; } }
        });
        
        const sortOrder = { q:1, r:2, b:3, n:4, p:5 };
        wCap.sort((a,b) => sortOrder[a] - sortOrder[b]);
        bCap.sort((a,b) => sortOrder[a] - sortOrder[b]);

        return { 
          whiteCapturedList: wCap, blackCapturedList: bCap, 
          whiteAdvantage: wScore > bScore ? wScore - bScore : 0, 
          blackAdvantage: bScore > wScore ? bScore - wScore : 0
        };
      };

      const mat = calculateMaterial(currentBoard.fen());
      const playMat = calculateMaterial(playBoard.fen());

      const getSquareCoordinates = useCallback((square) => {
        if (!square || square.length < 2) return {x:0, y:0};
        const file = square.charCodeAt(0) - 97; 
        const rank = 8 - parseInt(square[1]);  
        
        const isBoardFlipped = view === 'playing' ? (playPlayerColor === 'b') : isFlipped;
        const visualC = isBoardFlipped ? 7 - file : file;
        const visualR = isBoardFlipped ? 7 - rank : rank;
        return { x: visualC * 12.5 + 6.25, y: visualR * 12.5 + 6.25 };
      }, [isFlipped, view, playPlayerColor]);

      const returnToMainLine = () => {
        setHistory(mainLine);
        setEvalCurve(mainEvalCurve);
        setCurrentMoveIndex(branchStartIndex > -1 ? branchStartIndex : 0);
        setBranchStartIndex(-1);
      };

      const whiteMovesMade = Math.floor((currentMoveIndex + 2) / 2);
      const blackMovesMade = Math.floor((currentMoveIndex + 1) / 2);
      const whiteTime = gameClocks.white[Math.min(whiteMovesMade, gameClocks.white.length - 1)] || gameClocks.start;
      const blackTime = gameClocks.black[Math.min(blackMovesMade, gameClocks.black.length - 1)] || gameClocks.start;

      // Derived Play history for the live right panel
      const playHistoryRaw = playBoard.history({ verbose: true });
      const playMovePairs = [];
      for (let i = 0; i < playHistoryRaw.length; i += 2) {
          playMovePairs.push({ w: playHistoryRaw[i], b: playHistoryRaw[i + 1] || null });
      }

      return (
        <div className={`min-h-screen ${t.bg} font-sans flex flex-col relative overflow-x-hidden transition-colors duration-500`}>
          
          {isGameLoading && <DeepGameLoader appTheme={appTheme} />}
          
          {showSettingsModal && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in">
               <div className={`w-[90%] max-w-xl ${t.panel} border ${t.border} rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-slide-up`}>
                  <div className={`flex justify-between items-center p-4 border-b ${t.border}`}>
                     <h3 className={`font-black text-lg ${t.text} flex items-center gap-2`}><Settings size={20} className={t.accentText} /> System Preferences</h3>
                     <button onClick={() => setShowSettingsModal(false)} className={`p-1.5 rounded-lg hover:bg-black/10 dark:hover:bg-white/10 ${t.textMuted} transition-colors`}><X size={20}/></button>
                  </div>
                  
                  <div className="flex">
                     <div className={`w-1/3 flex flex-col border-r ${t.border} ${t.panelInner}`}>
                        <button onClick={()=>setSettingsTab('interface')} className={`p-4 text-left text-sm font-bold flex items-center gap-2 transition-colors ${settingsTab==='interface'?`${t.accent} text-white`:`${t.text} hover:bg-black/5 dark:hover:bg-white/5`}`}><Palette size={16}/> Interface</button>
                        <button onClick={()=>setSettingsTab('board')} className={`p-4 text-left text-sm font-bold flex items-center gap-2 transition-colors ${settingsTab==='board'?`${t.accent} text-white`:`${t.text} hover:bg-black/5 dark:hover:bg-white/5`}`}><Layout size={16}/> Board & Pieces</button>
                     </div>
                     
                     <div className="w-2/3 p-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
                        {settingsTab === 'interface' && (
                           <div className="space-y-6">
                              <div>
                                 <h4 className={`text-xs font-bold uppercase tracking-widest mb-3 ${t.textMuted}`}>App Theme</h4>
                                 <div className="grid grid-cols-1 gap-2">
                                    <button onClick={()=>setAppTheme('light')} className={`py-3 px-4 rounded-xl border flex items-center gap-3 transition-all ${appTheme==='light'?`${t.accent} text-white border-transparent shadow-md`:`${t.border} ${t.text} hover:bg-black/5`} text-sm font-bold`}><Sun size={18}/> Light (Default)</button>
                                    <button onClick={()=>setAppTheme('dark')} className={`py-3 px-4 rounded-xl border flex items-center gap-3 transition-all ${appTheme==='dark'?`${t.accent} text-white border-transparent shadow-md`:`${t.border} ${t.text} hover:bg-white/5`} text-sm font-bold`}><Moon size={18}/> Dark</button>
                                    <button onClick={()=>setAppTheme('neon')} className={`py-3 px-4 rounded-xl border flex items-center gap-3 transition-all ${appTheme==='neon'?`${t.accent} text-black border-transparent shadow-md`:`${t.border} ${t.text} hover:bg-white/5`} text-sm font-bold`}><Zap size={18}/> Neon Cyberspace</button>
                                 </div>
                              </div>
                              <div>
                                 <div className="flex justify-between items-center mb-2">
                                    <h4 className={`text-xs font-bold uppercase tracking-widest ${t.textMuted}`}>Eval Target Depth</h4>
                                    <span className={`text-xs font-black ${t.accentText}`}>Depth {targetDepth}</span>
                                 </div>
                                 <input type="range" min="10" max="24" value={targetDepth} onChange={(e) => setTargetDepth(parseInt(e.target.value))} style={{'--accent-color': appTheme === 'neon' ? '#06b6d4' : '#81b64c'}} />
                                 <p className={`text-[10px] mt-2 ${t.textMuted} font-medium`}>Higher depth means better accuracy but takes longer to load evaluations during manual analysis.</p>
                              </div>
                              <div className="space-y-2">
                                 <label className={`flex justify-between items-center cursor-pointer p-3 rounded-xl border ${t.border} ${t.panelInner} hover:bg-black/5 dark:hover:bg-white/5 transition-colors`}>
                                    <span className={`text-xs font-bold uppercase tracking-widest ${t.text}`}>Show Evaluation Bar</span>
                                    <div className="relative">
                                       <input type="checkbox" className="sr-only toggle-checkbox" checked={showEvalBar} onChange={() => setShowEvalBar(!showEvalBar)} />
                                       <div className={`block w-10 h-6 rounded-full transition-colors ${showEvalBar ? t.accent : 'bg-gray-400 dark:bg-gray-600'}`}></div>
                                       <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${showEvalBar ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                 </label>
                                 <label className={`flex justify-between items-center cursor-pointer p-3 rounded-xl border ${t.border} ${t.panelInner} hover:bg-black/5 dark:hover:bg-white/5 transition-colors`}>
                                    <span className={`text-xs font-bold uppercase tracking-widest ${t.text}`}>Fast Animations</span>
                                    <div className="relative">
                                       <input type="checkbox" className="sr-only toggle-checkbox" checked={fastAnimations} onChange={() => setFastAnimations(!fastAnimations)} />
                                       <div className={`block w-10 h-6 rounded-full transition-colors ${fastAnimations ? t.accent : 'bg-gray-400 dark:bg-gray-600'}`}></div>
                                       <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${fastAnimations ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                 </label>
                              </div>
                           </div>
                        )}

                        {settingsTab === 'board' && (
                           <div className="space-y-6">
                              <div>
                                 <h4 className={`text-xs font-bold uppercase tracking-widest mb-3 ${t.textMuted}`}>Board Color</h4>
                                 <div className="grid grid-cols-2 gap-2">
                                    {Object.keys(BOARD_THEMES).map(btName => (
                                       <button key={btName} onClick={()=>setBoardTheme(btName)} className={`flex items-center gap-2 p-2.5 rounded-xl border transition-all ${boardTheme===btName?`${t.accent} text-white border-transparent shadow-md`:`${t.border} ${t.text} hover:bg-black/5 dark:hover:bg-white/5`} text-xs font-bold capitalize`}>
                                          <div className="w-5 h-5 rounded flex overflow-hidden shadow-sm"><div className={`w-1/2 h-full ${BOARD_THEMES[btName].light}`}></div><div className={`w-1/2 h-full ${BOARD_THEMES[btName].dark}`}></div></div>
                                          {btName}
                                       </button>
                                    ))}
                                 </div>
                              </div>
                              <div>
                                 <h4 className={`text-xs font-bold uppercase tracking-widest mb-3 ${t.textMuted}`}>Piece Set</h4>
                                 <div className="grid grid-cols-3 gap-2">
                                    {PIECE_SETS.map(ps => (
                                       <button key={ps} onClick={()=>setPieceSet(ps)} className={`flex flex-col items-center gap-1.5 p-2.5 rounded-xl border transition-all ${pieceSet===ps?`${t.accent} text-white border-transparent shadow-md`:`${t.border} ${t.text} hover:bg-black/5 dark:hover:bg-white/5`} text-[10px] font-bold capitalize`}>
                                          <img src={`https://images.chesscomfiles.com/chess-themes/pieces/${ps}/150/wn.png`} className="w-7 h-7 drop-shadow-md" alt={ps} />
                                          {ps.replace('_', ' ')}
                                       </button>
                                    ))}
                                 </div>
                              </div>
                              <div className="space-y-2">
                                 <label className={`flex justify-between items-center cursor-pointer p-3 rounded-xl border ${t.border} ${t.panelInner} hover:bg-black/5 dark:hover:bg-white/5 transition-colors`}>
                                    <span className={`text-xs font-bold uppercase tracking-widest ${t.text}`}>Board Coordinates</span>
                                    <div className="relative">
                                       <input type="checkbox" className="sr-only toggle-checkbox" checked={showCoords} onChange={() => setShowCoords(!showCoords)} />
                                       <div className={`block w-10 h-6 rounded-full transition-colors ${showCoords ? t.accent : 'bg-gray-400 dark:bg-gray-600'}`}></div>
                                       <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${showCoords ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                 </label>
                                 <label className={`flex justify-between items-center cursor-pointer p-3 rounded-xl border ${t.border} ${t.panelInner} hover:bg-black/5 dark:hover:bg-white/5 transition-colors`}>
                                    <span className={`text-xs font-bold uppercase tracking-widest ${t.text}`}>Legal Move Dots</span>
                                    <div className="relative">
                                       <input type="checkbox" className="sr-only toggle-checkbox" checked={showLegalMoves} onChange={() => setShowLegalMoves(!showLegalMoves)} />
                                       <div className={`block w-10 h-6 rounded-full transition-colors ${showLegalMoves ? t.accent : 'bg-gray-400 dark:bg-gray-600'}`}></div>
                                       <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${showLegalMoves ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                 </label>
                                 <label className={`flex justify-between items-center cursor-pointer p-3 rounded-xl border ${t.border} ${t.panelInner} hover:bg-black/5 dark:hover:bg-white/5 transition-colors`}>
                                    <span className={`text-xs font-bold uppercase tracking-widest ${t.text}`}>Piece Highlights</span>
                                    <div className="relative">
                                       <input type="checkbox" className="sr-only toggle-checkbox" checked={showHighlights} onChange={() => setShowHighlights(!showHighlights)} />
                                       <div className={`block w-10 h-6 rounded-full transition-colors ${showHighlights ? t.accent : 'bg-gray-400 dark:bg-gray-600'}`}></div>
                                       <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${showHighlights ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                 </label>
                                 <label className={`flex justify-between items-center cursor-pointer p-3 rounded-xl border ${t.border} ${t.panelInner} hover:bg-black/5 dark:hover:bg-white/5 transition-colors`}>
                                    <span className={`text-xs font-bold uppercase tracking-widest ${t.text}`}>Blindfold Mode</span>
                                    <div className="relative">
                                       <input type="checkbox" className="sr-only toggle-checkbox" checked={blindfoldMode} onChange={() => setBlindfoldMode(!blindfoldMode)} />
                                       <div className={`block w-10 h-6 rounded-full transition-colors ${blindfoldMode ? t.accent : 'bg-gray-400 dark:bg-gray-600'}`}></div>
                                       <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${blindfoldMode ? 'transform translate-x-4' : ''}`}></div>
                                    </div>
                                 </label>
                              </div>
                           </div>
                        )}
                     </div>
                  </div>
               </div>
            </div>
          )}

          {(view === 'home' || view === 'play-setup') && <FloatingPiecesBackground appTheme={appTheme} />}

          <nav className={`w-full ${t.panel} ${t.border} border-b py-3 px-6 flex justify-between items-center shrink-0 shadow-sm z-40 relative`}>
            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setView('home')}>
              <div className={`w-9 h-9 rounded-xl ${t.accent} flex items-center justify-center transition-transform duration-300 group-hover:scale-110 group-hover:rotate-12 shadow-md ${appTheme==='neon'?'text-black':'text-white'}`}><Brain size={20} /></div>
              <span className={`font-black text-xl ${t.text} tracking-tight`}>Grandmaster OS</span>
            </div>
            <div className="flex gap-2 items-center">
              <button onClick={() => setView('play-setup')} className={`px-4 py-2 rounded-xl flex items-center gap-2 ${t.panelInner} border ${t.border} ${t.text} hover:${t.accentText} hover:border-current transition-all text-sm font-bold shadow-sm`}>
                <Gamepad2 size={18} /> Play AI
              </button>
              <button onClick={() => setShowSettingsModal(true)} className={`p-2.5 rounded-xl ${t.panelInner} border ${t.border} hover:bg-black/10 dark:hover:bg-white/10 ${t.textMuted} hover:${t.text} transition-all shadow-sm`}>
                <Settings size={20} />
              </button>
