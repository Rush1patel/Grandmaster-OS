                              <div 
                                key={`live_badge_${currentMoveIndex}_${history[currentMoveIndex].quality.id}`}
                                className="absolute w-[22px] h-[22px] md:w-[26px] md:h-[26px] rounded-full flex items-center justify-center text-white font-black border-[2px] border-white shadow-xl transition-colors duration-300 animate-pop z-40"
                                style={{ backgroundColor: history[currentMoveIndex].quality.color, left: `${getSquareCoordinates(history[currentMoveIndex].to).x + 5.5}%`, top: `${getSquareCoordinates(history[currentMoveIndex].to).y - 5.5}%`, transform: 'translate(-50%, -50%)' }}
                              >
                                <span className="flex items-center justify-center leading-none tracking-tighter" style={{ fontSize: history[currentMoveIndex].quality.icon.length > 1 ? '10px' : '14px' }}>
                                  {history[currentMoveIndex].quality.icon}
                                </span>
                              </div>
                            )
                          )}
                        </div>

                        <div 
                          className="absolute inset-0 z-50 grid grid-cols-8 grid-rows-8 w-full h-full touch-none select-none"
                          ref={boardDOMRef} onPointerMove={handleGridPointerMove} onPointerUp={handleGridPointerUp} onPointerLeave={handleGridPointerUp} onContextMenu={(e) => e.preventDefault()}
                        >
                          {Array.from({length: 64}).map((_, i) => {
                            const visualRow = Math.floor(i / 8);
                            const visualCol = i % 8;
                            const r = isFlipped ? 7 - visualRow : visualRow;
                            const c = isFlipped ? 7 - visualCol : visualCol;
                            const sq = String.fromCharCode(97 + c) + (8 - r);
                            const isValidMove = validTargetSquares.includes(sq);

                            return (
                              <div key={`interact_${sq}`} onPointerDown={(e) => handleGridPointerDown(e, sq)} className="relative w-full h-full cursor-pointer transition-colors">
                                {showLegalMoves && isValidMove && (
                                   <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-40">
                                     {currentBoard.get(sq) ? <div className="w-[85%] h-[85%] rounded-full border-[6px] border-[rgba(0,0,0,0.3)]"></div> : <div className="w-[30%] h-[30%] rounded-full bg-[rgba(0,0,0,0.3)]"></div>}
                                   </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    <PlayerBanner 
                      name={isFlipped ? (fullGame.header().Black || 'Black Player') : (fullGame.header().White || 'White Player')} 
                      rating={isFlipped ? fullGame.header().BlackElo : fullGame.header().WhiteElo}
                      capturedPieces={isFlipped ? mat.blackCapturedList : mat.whiteCapturedList}
                      advantage={isFlipped ? mat.blackAdvantage : mat.whiteAdvantage}
                      clock={isFlipped ? blackTime : whiteTime}
                      isBottom={true} t={t} isFlipped={isFlipped}
                    />
                  </div>
                </div>

                <div className={`w-full lg:w-[350px] xl:w-[400px] flex flex-col h-[500px] lg:h-[min(80vh,800px)] rounded-2xl ${t.panel} border ${t.border} shadow-2xl shrink-0 mt-6 lg:mt-0 overflow-hidden`}>
                  
                  <div className={`flex border-b ${t.border} shrink-0`}>
                     <button onClick={()=>setActiveTab('report')} className={`flex-1 py-4 text-xs uppercase font-bold border-b-2 ${activeTab==='report'?`border-[${t.accentText.split('-')[1]}] ${t.text}`:`border-transparent ${t.textMuted} hover:${t.text}`}`}>Report</button>
                     <button onClick={()=>setActiveTab('analysis')} className={`flex-1 py-4 text-xs uppercase font-bold border-b-2 ${activeTab==='analysis'?`border-[${t.accentText.split('-')[1]}] ${t.text}`:`border-transparent ${t.textMuted} hover:${t.text}`}`}>Analysis</button>
                     <button onClick={()=>setActiveTab('details')} className={`flex-1 py-4 text-xs uppercase font-bold border-b-2 ${activeTab==='details'?`border-[${t.accentText.split('-')[1]}] ${t.text}`:`border-transparent ${t.textMuted} hover:${t.text}`}`}>Details</button>
                     <button onClick={()=>{setView('home'); setHistory([]); setMainLine([]); setBranchStartIndex(-1);}} className={`flex-1 py-4 text-xs uppercase font-bold border-b-2 border-transparent ${t.textMuted} hover:${t.text}`}>Exit</button>
                  </div>

                  <div className="p-4 flex-1 overflow-y-auto custom-scrollbar relative">
                    
                    {activeTab === 'report' && gameMetrics && (
                      <div className="space-y-4 animate-in fade-in">
                        
                        <div className={`flex justify-between items-center px-4 py-2 ${t.panelInner} rounded-xl border ${t.border}`}>
                          <div className="text-xs font-bold flex flex-col"><span className={t.text}>{fullGame.header().White || 'White'}</span><span className={`${t.textMuted} font-normal`}>White</span></div>
                          <div className={`text-[10px] ${t.textMuted} bg-black/10 dark:bg-white/10 px-2 py-1 rounded-md uppercase font-bold`}>VS</div>
                          <div className="text-xs font-bold flex flex-col items-end"><span className={t.text}>{fullGame.header().Black || 'Black'}</span><span className={`${t.textMuted} font-normal`}>Black</span></div>
                        </div>

                        <div className="flex flex-col gap-3">
                           <div className={`p-5 rounded-xl border ${t.border} ${t.panelInner} shadow-sm`}>
                              <div className="flex items-center justify-center gap-2 mb-4">
                                 <Target size={16} className={t.accentText}/> 
                                 <span className={`text-xs uppercase font-bold tracking-widest ${t.textMuted}`}>Accuracy</span>
                              </div>
                              <div className="flex gap-8">
                                 <ProgressBar label={fullGame.header().White || 'White'} value={gameMetrics.white.accuracy} isWhite={true} t={t} />
                                 <ProgressBar label={fullGame.header().Black || 'Black'} value={gameMetrics.black.accuracy} isWhite={false} t={t} />
                              </div>
                           </div>
                           
                           <div className={`p-5 rounded-xl border ${t.border} ${t.panelInner} shadow-sm`}>
                              <div className="flex items-center justify-center gap-2 mb-4">
                                 <Activity size={16} className={t.accentText}/> 
                                 <span className={`text-xs uppercase font-bold tracking-widest ${t.textMuted}`}>Est. Rating</span>
                              </div>
                              <div className="flex gap-8">
                                 <ProgressBar label={fullGame.header().White || 'White'} value={gameMetrics.white.estimated} max={3000} isWhite={true} t={t} />
                                 <ProgressBar label={fullGame.header().Black || 'Black'} value={gameMetrics.black.estimated} max={3000} isWhite={false} t={t} />
                              </div>
                           </div>
                        </div>

                        <LiveEvalGraph evalCurve={evalCurve} history={history} currentMoveIndex={currentMoveIndex} goToMove={goToMove} t={t} />

                        <div className="flex gap-4">
                          <div className={`flex-1 ${t.panelInner} p-4 rounded-xl border ${t.border} flex flex-col justify-center items-center text-center shadow-sm hover:bg-white/5 transition-colors`}>
                            <Flame size={20} className="text-[#81b64c] mb-2 drop-shadow-sm" />
                            <span className={`text-[10px] uppercase font-bold ${t.textMuted} tracking-wider`}>Your Top Moves</span>
                            <span className={`text-2xl font-black ${t.text} mt-1`}>{gameMetrics.userTopMoves}</span>
                          </div>
                          <div className={`flex-1 ${t.panelInner} p-4 rounded-xl border ${t.border} flex flex-col justify-center items-center text-center shadow-sm hover:bg-white/5 transition-colors`}>
                            <XCircle size={20} className="text-[#ca3431] mb-2 drop-shadow-sm" />
                            <span className={`text-[10px] uppercase font-bold ${t.textMuted} tracking-wider`}>Your Mistakes</span>
                            <span className={`text-2xl font-black ${t.text} mt-1`}>{gameMetrics.userMistakes}</span>
                          </div>
                        </div>

                        <div className="flex flex-col xl:flex-row gap-4 mt-4">
                          <div className={`flex-1 ${t.panelInner} rounded-xl p-3 border ${t.border}`}>
                            <div className={`flex justify-between items-center mb-3 border-b ${t.border} pb-2`}>
                                <span className="text-[#81b64c] font-bold text-xs flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#81b64c]"></span> Good</span>
                                <div className={`flex gap-2 text-[10px] font-bold ${t.text}`}><span className={`bg-white text-black rounded-full w-4 h-4 flex items-center justify-center shadow-sm`}>w</span><span className={`bg-[#222] text-[#e3e3e3] border border-[#444] rounded-full w-4 h-4 flex items-center justify-center shadow-sm`}>b</span></div>
                            </div>
                            {[MOVE_TYPES.SIGMA, MOVE_TYPES.AWESOME, MOVE_TYPES.BEST, MOVE_TYPES.NICE, MOVE_TYPES.OK, MOVE_TYPES.THEORETICAL].map(mt => (
                              <div key={mt.id} className="flex justify-between items-center py-1.5 text-xs hover:bg-black/5 dark:hover:bg-white/5 rounded px-1 -mx-1 transition-colors">
                                 <span className="flex items-center gap-1 w-20" style={{color: mt.color}}>
                                   <span className="w-4 h-4 rounded-sm flex items-center justify-center text-[8px] text-white font-black shadow-sm" style={{backgroundColor: mt.color}}>{mt.icon}</span> {mt.label}
                                 </span>
                                 <span className={`font-bold ${t.text} w-6 text-center`}>{gameMetrics.white.counts[mt.id] || 0}</span>
                                 <span className={`font-bold ${t.textMuted} w-6 text-center`}>{gameMetrics.black.counts[mt.id] || 0}</span>
                              </div>
                            ))}
                          </div>

                          <div className={`flex-1 ${t.panelInner} rounded-xl p-3 border ${t.border}`}>
                            <div className={`flex justify-between items-center mb-3 border-b ${t.border} pb-2`}>
                                <span className="text-[#ca3431] font-bold text-xs flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#ca3431]"></span> Bad</span>
                                <div className={`flex gap-2 text-[10px] font-bold ${t.text}`}><span className={`bg-white text-black rounded-full w-4 h-4 flex items-center justify-center shadow-sm`}>w</span><span className={`bg-[#222] text-[#e3e3e3] border border-[#444] rounded-full w-4 h-4 flex items-center justify-center shadow-sm`}>b</span></div>
                            </div>
                            {[MOVE_TYPES.STRANGE, MOVE_TYPES.BAD, MOVE_TYPES.CLOWN].map(mt => (
                              <div key={mt.id} className="flex justify-between items-center py-1.5 text-xs hover:bg-black/5 dark:hover:bg-white/5 rounded px-1 -mx-1 transition-colors">
                                 <span className="flex items-center gap-1 w-20" style={{color: mt.color}}>
                                   <span className="w-4 h-4 rounded-sm flex items-center justify-center text-[8px] text-white font-black shadow-sm" style={{backgroundColor: mt.color}}>{mt.icon}</span> {mt.label}
                                 </span>
                                 <span className={`font-bold text-[#ca3431] w-6 text-center`}>{gameMetrics.white.counts[mt.id] || 0}</span>
                                 <span className={`font-bold ${t.textMuted} w-6 text-center`}>{gameMetrics.black.counts[mt.id] || 0}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className={`p-4 rounded-xl border ${t.border} ${t.panelInner}`}>
                          <div className="flex justify-between items-center mb-3">
                             <h4 className={`text-xs font-black uppercase ${t.textMuted}`}>Game Moves</h4>
                             <button onClick={() => setMovesExpanded(!movesExpanded)} className={`flex items-center gap-1 text-[10px] ${t.accentText} uppercase font-bold hover:brightness-125 transition-all`}>
                               {movesExpanded ? <Minimize2 size={12} /> : <Maximize2 size={12} />} {movesExpanded ? 'Show Less' : 'Show All'}
                             </button>
                          </div>
                          <div className="flex flex-wrap gap-1.5 mt-2">
                            {mainLine.slice(0, movesExpanded ? mainLine.length : 10).map((m, i) => (
                               <div 
                                 key={i} onClick={() => goToMove(i)} 
                                 className={`cursor-pointer flex items-center gap-1 text-[11px] px-2 py-1.5 rounded-lg border ${currentMoveIndex === i ? `bg-[${t.accentText.split('-')[1]}]/20 border-[${t.accentText.split('-')[1]}]` : `bg-black/5 dark:bg-white/5 border-black/5 dark:border-white/5`} hover:border-gray-400 transition-colors shadow-sm`}
                               >
                                  <span className={t.textMuted}>{m.color==='w' ? `${Math.floor(i/2)+1}.` : ''}</span>
                                  <span className={`${t.text} font-bold`}>{formatSan(m.san)}</span>
                                  {m.quality && m.quality.id !== 'ok' && m.quality.id !== 'theoretical' && (
                                    <span style={{color: m.quality.color}} className="font-black text-[10px] ml-0.5 tracking-tighter">{m.quality.icon}</span>
                                  )}
                               </div>
                            ))}
                          </div>
                        </div>

                      </div>
                    )}

                    {activeTab === 'analysis' && (
                      <div className="space-y-4 animate-in fade-in">
                        <div className={`p-4 rounded-xl border ${t.border} ${t.panelInner} relative overflow-hidden min-h-[80px] flex flex-col justify-center`}>
                          <div className="flex items-center justify-between z-10 relative mb-1">
                             <div className="flex items-center gap-4">
                               <span className={`text-4xl font-mono font-black ${t.text} ${analyzing ? 'opacity-90' : ''}`}>
                                 {deepAnalyzing ? (
                                   <span className="flex items-center gap-2 text-2xl text-cyan-500 animate-pulse"><Loader2 size={24} className="animate-spin" /> Eval...</span>
                                 ) : (
                                   evaluation > 0 ? `+${Number(evaluation).toFixed(2)}` : Number(evaluation).toFixed(2)
                                 )}
                               </span>
                             </div>
                             <div className="flex flex-col items-end text-right">
                               <span className={`text-sm font-bold ${t.text}`}>Depth <span className="text-[#f3ae16]">{engineDepth || '--'}</span></span>
                               <span className={`text-[10px] ${t.textMuted} font-bold mt-1 tracking-wide`}>SF 10.0 WASM</span>
                             </div>
                          </div>
                          
                          {analyzing && (
                            <div 
                              className="absolute bottom-1.5 left-0 right-0 w-full flex justify-center items-center gap-[6px]" 
                              style={{ maskImage: 'linear-gradient(to right, transparent, black 5%, black 95%, transparent)', WebkitMaskImage: 'linear-gradient(to right, transparent, black 5%, black 95%, transparent)' }}
                            >
                               {[0, 1, 2, 3, 4, 5].map(i => (
                                 <div 
                                   key={i} className="w-1.5 h-1.5 rounded-full animate-smart-slide"
                                   style={{ backgroundColor: appTheme === 'neon' ? '#06b6d4' : '#f3ae16', animationDelay: `${i * 0.12}s` }}
                                 />
                               ))}
                            </div>
                          )}
                        </div>
                        
                        <div className={`p-4 rounded-xl border ${t.border} ${t.panelInner}`}>
                          <h4 className={`text-xs font-black uppercase mb-4 flex items-center gap-2 ${t.textMuted}`}>
                            <Activity size={14} /> Engine Top Lines
                          </h4>
                          {deepAnalyzing ? (
                            <div className={`flex flex-col items-center justify-center py-6 gap-3 ${t.textMuted} text-xs font-medium uppercase tracking-widest animate-pulse`}>
                               <Brain size={24} className="text-cyan-500 opacity-50" /> Processing Variation...
                            </div>
                          ) : engineLines.filter(Boolean).length > 0 ? (
                            <div className="space-y-2">
                              {engineLines.filter(Boolean).map((line, i) => (
                                <div 
                                  key={i} onClick={() => playEngineMove(line.move)}
                                  className={`flex items-center gap-4 p-2 rounded-lg cursor-pointer hover:bg-black/5 dark:hover:bg-white/10 transition-colors group ${i===0 ? `border ${t.border} ${t.panel}` : ''}`}
                                >
                                  <span className={`w-12 text-center font-mono text-xs font-bold ${Number(line.eval) >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                    {Number(line.eval) > 0 ? `+${Number(line.eval).toFixed(2)}` : Number(line.eval).toFixed(2)}
                                  </span>
                                  <span className={`font-bold text-sm flex items-center gap-1 ${t.text} group-hover:${t.accentText} transition-colors`}>{formatSan(line.move)}</span>
                                  {i===0 && <span className={`text-[9px] uppercase font-black px-2 py-0.5 rounded ${t.accent} ${appTheme==='neon'?'text-black':'text-white'} ml-auto`}>Best</span>}
                                </div>
                              ))}
                            </div>
                          ) : (
                            <div className={`flex items-center gap-3 ${t.textMuted} text-xs font-medium italic`}>Waiting for position...</div>
                          )}
                        </div>
                        
                        <div className={`p-4 rounded-xl border border-[#81b64c]/50 ${t.panelInner} bg-[#81b64c]/5`}>
                          <p className={`text-xs ${t.textMuted}`}><strong>Free Play Active:</strong> Click any piece on the board or tap an engine line above to test custom variations.</p>
                        </div>
                      </div>
                    )}

                    {activeTab === 'details' && (
                      <div className="space-y-4 animate-in fade-in duration-300">
                         <div className={`p-4 rounded-xl border ${t.border} ${t.panelInner} space-y-3`}>
                           {Object.entries(fullGame.header()).map(([key, val]) => (
                             <div key={key} className={`flex justify-between items-center border-b ${t.border} pb-2 last:border-0 last:pb-0`}>
                               <span className={`text-xs font-bold ${t.textMuted}`}>{key}</span>
                               <span className={`text-xs font-medium ${t.text}`}>{typeof val === 'object' ? JSON.stringify(val) : String(val)}</span>
                             </div>
                           ))}
                         </div>
                         <div className={`p-4 rounded-xl border ${t.border} ${t.panelInner}`}>
                           <h4 className={`text-xs font-black uppercase mb-2 ${t.textMuted}`}>Raw PGN</h4>
                           <p className={`text-[10px] ${t.textMuted} font-mono break-all leading-relaxed`}>
                             {fullGame.pgn()}
                           </p>
                         </div>
                      </div>
                    )}
                  </div>

                  <div className={`p-3 lg:p-4 border-t ${t.border} ${t.panelInner} shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]`}>
                    {branchStartIndex !== -1 && (
                      <button 
                        onClick={returnToMainLine} 
                        className={`w-full mb-3 text-xs font-bold flex items-center justify-center gap-1.5 uppercase tracking-wider border-2 ${t.border} ${t.text} hover:bg-black/5 dark:hover:bg-white/5 py-2.5 rounded-xl transition-all shadow-sm active:scale-95`}
                      >
                        <ChevronsLeft size={16} /> Return to Game
                      </button>
                    )}

                    <div className="flex gap-2 w-full">
                      <button onClick={() => goToMove(-1)} className={`flex-1 py-3 md:py-4 rounded-xl flex justify-center items-center ${t.accent} ${appTheme==='neon'?'text-black':'text-white'} hover:brightness-110 active:scale-95 transition-all shadow-md`}>
                        <ChevronsLeft size={22} strokeWidth={3} />
                      </button>
                      <button onClick={() => goToMove(currentMoveIndex - 1)} className={`flex-1 py-3 md:py-4 rounded-xl flex justify-center items-center ${t.accent} ${appTheme==='neon'?'text-black':'text-white'} hover:brightness-110 active:scale-95 transition-all shadow-md`}>
                        <ChevronLeft size={22} strokeWidth={3} />
                      </button>
                      <button onClick={() => goToMove(currentMoveIndex + 1)} className={`flex-1 py-3 md:py-4 rounded-xl flex justify-center items-center ${t.accent} ${appTheme==='neon'?'text-black':'text-white'} hover:brightness-110 active:scale-95 transition-all shadow-md`}>
                        <ChevronRight size={22} strokeWidth={3} />
                      </button>
                      <button onClick={() => goToMove(history.length - 1)} className={`flex-1 py-3 md:py-4 rounded-xl flex justify-center items-center ${t.accent} ${appTheme==='neon'?'text-black':'text-white'} hover:brightness-110 active:scale-95 transition-all shadow-md`}>
                        <ChevronsRight size={22} strokeWidth={3} />
                      </button>
                      
                      <button 
                        onClick={() => setIsFlipped(!isFlipped)} 
                        className={`w-12 md:w-14 py-3 md:py-4 rounded-xl flex justify-center items-center bg-black/5 dark:bg-white/10 ${t.text} hover:bg-black/10 dark:hover:bg-white/20 active:scale-95 transition-all shadow-md`}
                        title="Flip Board"
                      >
                        <ArrowUpDown size={20} strokeWidth={2.5} />
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            ) : null}
          </div>
          
          <footer className={`w-full py-6 mt-auto text-center ${t.textMuted} flex flex-col items-center justify-center z-40 relative border-t ${t.border}`}>
            <div className="flex items-center gap-1.5 text-sm font-medium">
              Made with <Heart size={16} className="text-red-500 fill-red-500 animate-pulse drop-shadow-[0_0_10px_rgba(239,68,68,0.8)] mx-0.5" /> by
              <a href="https://github.com/Rush1patel" target="_blank" rel="noopener noreferrer" className={`flex items-center gap-1.5 ml-1 ${t.text} hover:${t.accentText} transition-colors font-bold group`}>
                <Github size={16} className="group-hover:scale-110 group-hover:-rotate-6 transition-transform" /> Rush1patel
              </a>
            </div>
          </footer>

        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
